name: KauMaeAI
options:
  bundleIdPrefix: com.kaumae
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  KauMaeCore:
    path: .
targets:
  KauMaeAI:
    type: application
    platform: iOS
    sources:
      - KauMaeAIApp
    resources:
      - KauMaeAIApp/Resources
      - KauMaeAIApp/Assets.xcassets
      - KauMaeAIApp/StoreKit
    dependencies:
      - package: KauMaeCore
        product: KauMaeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaumae.KauMaeAI
        INFOPLIST_FILE: KauMaeAIApp/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
